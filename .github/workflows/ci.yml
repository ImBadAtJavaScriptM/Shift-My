name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...
      - run: go vet ./...
      - run: bash -n deploy/scripts/bootstrap.sh
      - run: bash -n deploy/scripts/update-existing.sh
      - name: Validate IPv6 deployment support
        run: |
          grep -q 'SHIFT_MY_PUBLIC_IP=' .env.example
          grep -q 'SHIFT_MY_PUBLIC_IP=' deploy/shift-my.env.example
          grep -q 'listen \[::\]:443;' deploy/nginx/nginx.conf
          grep -q 'listen \[::\]:80' deploy/nginx/nginx.conf
          grep -q 'map_hash_bucket_size 128;' deploy/nginx/nginx.conf
          if grep -R -n 'SHIFT_MY_PUBLIC_IPV4' deploy .env.example README.md docs/testing; then
            echo 'legacy IPv4-only configuration remains in deployable paths'
            exit 1
          fi
      - name: Reject production Apple location routes
        run: |
          if find cmd internal deploy web -type f ! -name '*_test.go' -print0 \
            | xargs -0 grep -nE 'gs-loc\.apple\.com|gs-loc-cn\.apple\.com|iphone-services\.apple\.com'; then
            echo 'production Apple location hostname found in active implementation'
            exit 1
          fi
      - name: Validate attested two-stage profile guards
        run: |
          grep -q '"HardwareBound": *true' internal/profile/generator.go
          grep -q '"Attest": *true' internal/profile/generator.go
          grep -q '"KeyIsExtractable": *false' internal/profile/generator.go
          grep -q 'GenerateStage2' internal/profile/generator.go
          grep -q 'ExtKeyUsageClientAuth' internal/pki/client.go
          if grep -q 'ExtKeyUsageServerAuth' internal/pki/client.go; then
            echo 'identity certificate issuer must not grant server-auth'
            exit 1
          fi
