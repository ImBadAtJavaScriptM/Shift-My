name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - run: go test ./...
      - run: go vet ./...
      - run: bash -n deploy/scripts/bootstrap.sh
      - name: Reject production Apple location routes
        run: |
          if find cmd internal deploy web -type f ! -name '*_test.go' -print0 \
            | xargs -0 grep -nE 'gs-loc\.apple\.com|gs-loc-cn\.apple\.com|iphone-services\.apple\.com'; then
            echo 'production Apple location hostname found in active implementation'
            exit 1
          fi
