user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

# Dedicated VPS TLS router for the Shift-My controlled lab.
# Replace PUBLIC_HOST_PLACEHOLDER before installation.
stream {
    map_hash_bucket_size 128;

    map $ssl_preread_server_name $shift_my_backend {
        PUBLIC_HOST_PLACEHOLDER                    127.0.0.1:8443;
        loc-a.PUBLIC_HOST_PLACEHOLDER              127.0.0.1:9443;
        loc-b.PUBLIC_HOST_PLACEHOLDER              127.0.0.1:9443;
        device-loc.PUBLIC_HOST_PLACEHOLDER         127.0.0.1:9443;
        default                                    127.0.0.1:9;
    }

    server {
        listen 443;
        listen [::]:443;
        proxy_connect_timeout 5s;
        proxy_timeout 30s;
        proxy_pass $shift_my_backend;
        ssl_preread on;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 404;
    }
}
